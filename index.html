<style>

<header><h1 id="ttl">长大</h1><span class="streak" id="streak"></span></header>

<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5.0/dist/hanzi-writer.min.js"></script>

<!-- ====================== CORE: pure logic, unit-tested by tools/test-core.cjs ====================== -->
<script id="core">
const Core = (() => {
  // ---------- pinyin ----------
  const MARKS = {'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['ü',1],'ǘ':['ü',2],'ǚ':['ü',3],'ǜ':['ü',4],'ń':['n',2],'ň':['n',3],'ǹ':['n',4],'ḿ':['m',2]};
  const ACC = {a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù','ü':'ǖǘǚǜ',n:'nńňǹ',m:'mḿmm'};
  function parseSyl(tok) {
    if (!tok) return null;
    const s = tok.toLowerCase().normalize('NFC').replace(/u:/g, 'ü').replace(/v/g, 'ü');
    let tone = 0, out = '';
    for (const ch of s) {
      if (MARKS[ch]) { out += MARKS[ch][0]; tone = MARKS[ch][1]; }
      else if (/[0-5]/.test(ch)) tone = +ch || 5;
      else if (/[a-zü]/.test(ch)) out += ch;
    }
    if (!out) return null;
    return { base: out, tone: tone || 5 };
  }
  const normBase = b => b.replace(/^([jqxy])ü/, '$1u');
  function markSyl(base, tone) {
    if (!tone || tone === 5) return base;
    let idx = -1;
    if (base.includes('a')) idx = base.indexOf('a');
    else if (base.includes('e')) idx = base.indexOf('e');
    else if (base.includes('ou')) idx = base.indexOf('o');
    else { for (let i = base.length - 1; i >= 0; i--) if ('iouü'.includes(base[i])) { idx = i; break; } }
    if (idx < 0) idx = base.search(/[nm]/);
    if (idx < 0) return base;
    const v = base[idx];
    return base.slice(0, idx) + ACC[v][tone - 1 + (v === 'n' || v === 'm' ? 0 : 0)] + base.slice(idx + 1);
  }
  // split typed pinyin ("ni3 hao3", "nǐhǎo", "ni3hao3", "nihao") into syllables
  function splitTyped(str, sylSet) {
    const out = [];
    const has = b => !sylSet || sylSet.has(normBase(b)) || (b.endsWith('r') && b !== 'er' && sylSet.has(normBase(b.slice(0, -1))));
    for (const tok of String(str).toLowerCase().split(/[\s'’,，。.!?！？、;；:：]+/)) {
      if (!tok) continue;
      const parts = tok.match(/[^0-5]+[0-5]?/g) || [];
      for (const part of parts) {
        const p = parseSyl(part);
        if (!p) continue;
        if (has(p.base)) { out.push(p); continue; }
        // greedy longest-match over the bare letters, keeping tone marks with their syllable
        const cells = []; let digit = 0;
        for (const ch of part.normalize('NFC').replace(/v/g, 'ü')) {
          if (MARKS[ch]) cells.push({ b: MARKS[ch][0], t: MARKS[ch][1] });
          else if (/[0-5]/.test(ch)) digit = +ch || 5;
          else if (/[a-zü]/.test(ch)) cells.push({ b: ch, t: 0 });
        }
        const bases = cells.map(c => c.b).join('');
        let i = 0;
        while (i < cells.length) {
          let L = Math.min(7, cells.length - i);
          for (; L > 0; L--) if (has(bases.slice(i, i + L))) break;
          if (L === 0) L = 1;
          const seg = cells.slice(i, i + L);
          out.push({ base: bases.slice(i, i + L), tone: (seg.find(c => c.t) || {}).t || 5 });
          i += L;
        }
        if (digit && out.length) out[out.length - 1].tone = digit;
      }
    }
    return out;
  }
  const isHan = c => /\p{Script=Han}/u.test(c);
  const PUNCT = /[，。！？；：、,.!?;:…—]/;
  // align a hanzi line with a per-syllable pinyin line; 儿化 syllables ("diǎnr") take X+儿
  function align(zh, p) {
    const toks = String(p || '').trim().split(/\s+/).map(parseSyl).filter(Boolean);
    const chars = [...String(zh || '')];
    const out = []; let ti = 0;
    for (let i = 0; i < chars.length; i++) {
      const c = chars[i];
      if (!isHan(c)) { if (out.length && PUNCT.test(c)) out[out.length - 1].brk = true; continue; }
      const t = toks[ti++];
      if (!t) return null;
      let hz = c;
      if (t.base.endsWith('r') && t.base !== 'er' && chars[i + 1] === '儿') { hz = c + '儿'; i++; }
      out.push({ hz, base: t.base, tone: t.tone, brk: false });
    }
    return ti === toks.length ? out : null;
  }
  const NUMS = '零一二三四五六七八九十两';
  // tone sandhi: 不, 一, 3+3 runs (grouped by dictionary words when a dict is given); marks half-third tones
  // ponytail: prosodic grouping is a heuristic (monosyllables lean on the next word); a real prosody parser is the upgrade
  function sandhi(syls, dict) {
    const out = syls.map(s => ({ ...s, sp: s.tone, half: false }));
    const nx = i => (out[i].brk || i + 1 >= out.length) ? null : out[i + 1];
    const pv = i => (i === 0 || out[i - 1].brk) ? null : out[i - 1];
    for (let i = 0; i < out.length; i++) {
      const s = out[i], n = nx(i), p = pv(i);
      if (s.hz === '不' && s.base === 'bu' && s.tone === 4) {
        if (p && n && p.hz === n.hz && (i < 2 || out[i - 2].hz !== '不')) s.sp = 5;
        else if (n && n.tone === 4) s.sp = 2;
      } else if (s.hz === '一' && s.base === 'yi' && s.tone === 1) {
        if (p && n && p.hz === n.hz && (i < 2 || out[i - 2].hz !== '一')) s.sp = 5;
        else if (!n || (p && (p.hz === '第' || NUMS.includes(p.hz) || '百千万'.includes(p.hz))) || NUMS.includes(n.hz) || '月号'.includes(n.hz)) { /* keep yī */ }
        else s.sp = (n.tone === 4 || n.tone === 5) ? 2 : 4;
      }
    }
    // word tokens over syllables (greedy longest match), so runs can be grouped
    const tok = new Array(out.length), tlen = new Array(out.length);
    for (let i = 0, id = 0; i < out.length; id++) {
      let L = 1;
      if (dict) for (let k = Math.min(6, out.length - i); k > 1; k--) {
        if (out.slice(i, i + k - 1).some(x => x.brk)) continue;
        if (dict.has(out.slice(i, i + k).map(x => x.hz).join(''))) { L = k; break; }
      }
      for (let k = 0; k < L; k++) { tok[i + k] = id; tlen[i + k] = L; }
      i += L;
    }
    for (let i = 0; i < out.length;) {
      if (out[i].sp !== 3) { i++; continue; }
      let j = i;
      while (j + 1 < out.length && !out[j].brk && out[j + 1].sp === 3) j++;
      if (j - i === 1) out[i].sp = 2;
      else if (j > i) {
        // segments of the run by token; monosyllabic words join the next segment
        const segs = []; for (let k = i; k <= j; k++) { if (k > i && tok[k] === tok[k - 1]) segs[segs.length - 1].push(k); else segs.push([k]); }
        const groups = []; let cur = [];
        segs.forEach((sg, x) => { cur.push(...sg); if (!(tlen[sg[0]] === 1 && x < segs.length - 1)) { groups.push(cur); cur = []; } });
        if (groups.length > 1 && groups[groups.length - 1].length === 1 && tlen[groups[groups.length - 1][0]] === 1) groups[groups.length - 2].push(...groups.pop());
        for (const g of groups) for (let k = 0; k < g.length - 1; k++) out[g[k]].sp = 2;
      }
      i = j + 1;
    }
    for (let i = 0; i < out.length; i++) if (out[i].sp === 3 && nx(i)) out[i].half = true;
    return out;
  }
  function edit(a, b, eq = (x, y) => x === y) {
    const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (eq(a[i - 1], b[j - 1]) ? 0 : 1));
    return d;
  }
  // compare target syllables [{base,tone,sp?,alt?}] with typed [{base,tone}] → per-syllable verdicts
  function comparePy(target, typed) {
    const eqB = (t, y) => normBase(t.base) === normBase(y.base);
    const d = edit(target, typed, eqB);
    const res = []; let i = target.length, j = typed.length;
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + (eqB(target[i - 1], typed[j - 1]) ? 0 : 1)) {
        const t = target[i - 1], y = typed[j - 1];
        let st = 'base';
        if (eqB(t, y)) st = (y.tone === t.tone || y.tone === t.sp || (t.alt && t.alt.includes(y.tone))) ? 'ok' : 'tone';
        res.unshift({ t, y, st }); i--; j--;
      } else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { res.unshift({ t: target[i - 1], y: null, st: 'miss' }); i--; }
      else { res.unshift({ t: null, y: typed[j - 1], st: 'extra' }); j--; }
    }
    return { ok: res.length > 0 && res.every(r => r.st === 'ok'), res };
  }
  // score heard syllables against the target: sounds (base) and tones separately; sandhi and citation tones both accepted
  function scoreHeard(target, heard) {
    const tg = target.map(t => ({ ...t, alt: [t.tone] }));
    const r = comparePy(tg, heard);
    // the recogniser can't show neutral tones (谢谢 comes back xie4 xie4), so neutral on either side matches any tone
    for (const x of r.res) if (x.st === 'tone' && (x.t.tone === 5 || x.t.sp === 5 || x.y.tone === 5)) x.st = 'ok';
    const n = Math.max(target.length, heard.length, 1);
    return { base: r.res.filter(x => x.st === 'ok' || x.st === 'tone').length / n, tone: r.res.filter(x => x.st === 'ok').length / n, res: r.res };
  }
  // ---------- text ----------
  function numToZh(n) {
    n = Math.floor(n); if (n === 0) return '零';

    ${FSRS_MODES.has(s.mode) && c ? `<div class="grades">${[1, 2, 3, 4].map(g => `<button class="btn${g === sug ? ' sug' : ''}" data-g="${g}">${['Again', 'Hard', 'Good', 'Easy'][g - 1]}<small>${nextLabel(c, g)}</small></button>`).join('')}</div>` : `<button class="btn pri block" data-g="${sug}">继续 Next</button>`}`;

  const s = SES; if (!s) return;

function essayFeedback(v, x) {

// ---------------- lessons, checkpoints, exams ----------------
const lessonDone = id => !!META.progress.lessons[id];
const unitPassed = u => (META.progress.units[u.id] || 0) >= 85;
const stagePassed = n => (META.progress.stages[n] || 0) >= 85;
function unitUnlocked(u) {
  if (S().unlockAll) return true;
  const list = unitsOfStage(u.stage), i = list.indexOf(u);
  if (i > 0) return unitPassed(list[i - 1]);
  return u.stage === 1 || stagePassed(u.stage - 1);
}
function lessonUnlocked(l) { const u = D.unitById.get(l.unit), i = u.lessons.indexOf(l); return unitUnlocked(u) && (i === 0 || lessonDone(u.lessons[i - 1].id) || S().unlockAll); }
function nextLesson() { for (const st of D.stages) for (const u of unitsOfStage(st.n)) { if (!unitUnlocked(u)) continue; for (const l of u.lessons) if (!lessonDone(l.id)) return l; } return null; }
function markLesson(l) { META.progress.lessons[l.id] = Date.now(); save(); }
function startLesson(l) {
  if (l.type === 'text') return go(`#text/${l.text}/${l.id}`);
  if (l.type === 'scenario') return go(`#scen/${D.unitById.get(l.unit).scenario.id}/${l.id}`);
  const items = (l.items || []).map(id => D.items.get(id)).filter(Boolean);
  const tasks = [];
  dayStat().new += items.filter(it => !CARDS.has(it.id + '|' + skillsFor(it)[0])).length;
  for (let k = 0; k < items.length; k += 4) {
    const chunk = items.slice(k, k + 4);
    chunk.forEach(it => { addItemCards(it); tasks.push({ kind: 'intro', item: it.id }); });
    const first = [];
    chunk.forEach(it => skillsFor(it).forEach(sk => first.push(cardTask(CARDS.get(it.id + '|' + sk), 'lesson'))));
    tasks.push(...shuffle(first));
  }
  for (const xid of l.ex || []) { const x = D.ex.get(xid); if (x) tasks.push(cardTask(addExCard(x), 'lesson')); }
  startSession(tasks, 'lesson', { onDone: pct => { markLesson(l); view.innerHTML = `<h2>课完成！ Lesson done</h2><div class="card center"><div class="big md">${pct}%</div><p>${esc(l.title)}</p><p class="small muted">New cards now follow their own review schedule, one per skill.</p></div><a class="btn pri block" href="#unit/${l.unit}">继续 Back to unit</a>`; checkStreak(); renderStreak(); } });
}
function examTasks(items, exs, n) {
  const tasks = [];
  const pool = items.filter(Boolean);
  const present = SKILLS.filter(sk => pool.some(it => skillsFor(it).includes(sk)));
  for (const sk of present) {
    const cand = pool.filter(it => skillsFor(it).includes(sk));
    for (const it of sample(cand, Math.ceil(n * 0.8 / present.length))) {
      const c = CARDS.get(it.id + '|' + sk) || { ...Core.newCard(it.id + '|' + sk, sk), item: it.id, reps: 1 };
      tasks.push({ item: it.id, card: null, kind: chooseKind({ ...c, reps: 1, st: 2, s: 5 }, it, 'check'), tmpCard: c });
    }
  }
  for (const x of sample(exs, Math.ceil(n / 5))) tasks.push({ ex: x.id, item: x.id, card: null });
  return shuffle(tasks).slice(0, n);
}
function startCheckpoint(u) {
  const tasks = examTasks(u.items, u.exercises || [], 24);
  startSession(tasks, 'check', { onDone: (pct, s) => {
    const prev = META.progress.units[u.id] || 0; META.progress.units[u.id] = Math.max(prev, pct); save();
    view.innerHTML = `<h2>检测 Checkpoint: ${esc(u.title)}</h2><div class="card center"><div class="big md">${pct}%</div><p>${pct >= 85 ? '✓ Passed. The next unit is open.' : '✗ You need 85%. Review the weak items and try again.'}</p></div><a class="btn pri block" href="#unit/${u.id}">Back to unit</a>`;
  } });
}
function startStageExam(n) {
  const us = unitsOfStage(n);
  const tasks = examTasks(us.flatMap(u => u.items), us.flatMap(u => u.exercises || []), 40);
  startSession(tasks, 'exam', { onDone: pct => { META.progress.stages[n] = Math.max(META.progress.stages[n] || 0, pct); save();
    view.innerHTML = `<h2>阶段考试 Stage ${n} exam</h2><div class="card center"><div class="big md">${pct}%</div><p>${pct >= 85 ? '🎓 Passed. The next stage is open.' : 'Not yet: 85% needed.'}</p></div><a class="btn pri block" href="#course">Course</a>`; } });
}
function startReviews(limit = 200) {
  const due = dueCards();

  due.sort((a, b) => a.due - b.due);

function startWeak() {

  const HSK = [[0, '—'], [300, 'HSK 1 (partial)'], [500, 'HSK 1'], [1272, 'HSK 2'], [2245, 'HSK 3'], [3245, 'HSK 4'], [4316, 'HSK 5'], [5456, 'HSK 6'], [11092, 'HSK 7–9']];
  const hsk = HSK.filter(h => words >= h[0]).pop()[1];
  const AGE = [[0, 'a 2-year-old'], [50, 'a 3-year-old'], [300, 'a 5-year-old (preschool)'], [800, 'a 7-year-old (grade 1)'], [1600, 'an 8-year-old (grade 2)'], [2500, 'a 10-year-old (grade 4)'], [3000, 'a 12-year-old (end of primary)'], [3500, 'a 15-year-old (end of middle school)'], [4500, 'an adult reader']];
  const age = AGE.filter(a => readChars.size >= a[0]).pop()[1];
  const tone = [1, 2, 3, 4].map(t => { const r = META.stats.tone[t]; return `<div class="stat"><b class="t${t}" style="color:var(--t${t})">${r && r.n ? Math.round(r.ok / r.n * 100) + '%' : '—'}</b>tone ${t}${r ? ` (${r.n})` : ''}</div>`; }).join('');
  const conf = Object.entries(META.stats.conf).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `T${k.replace('>', '→T')} ×${n}`).join(' · ');
  const weakest = cs.filter(c => c.st > 0).sort((a, b) => (b.lapses - a.lapses) || (a.s - b.s)).slice(0, 12);
  const days = Object.entries(META.stats.days).sort().slice(-14);
  const acc = days.reduce((a, [, d]) => [a[0] + d.ok, a[1] + d.rev], [0, 0]);
  view.innerHTML = `<h2>📊 Dashboard</h2>
  <div class="grid2"><div class="stat"><b>${words}</b>words (reading)</div><div class="stat"><b>${readChars.size}</b>characters recognised</div><div class="stat"><b>${writeChars.size}</b>characters you can handwrite</div><div class="stat"><b>${acc[1] ? Math.round(acc[0] / acc[1] * 100) : 0}%</b>accuracy, 14 days</div></div>
  <div class="card"><b>Level</b><p>Estimated <b>${hsk}</b>. Reading level of <b>${age}</b>.</p><p class="small muted">From words and characters at least in review in the reading skill.</p></div>
  <div class="card"><b>Per skill</b> <span class="small muted">learned · mature (≥21 days)</span>${SKILLS.map(sk => `<div class="mast"><span>${SK_ZH[sk]} ${sk}</span><div class="bar"><i style="width:${Math.min(100, known(sk) / Math.max(1, cs.filter(c => c.skill === sk).length) * 100)}%"></i></div><span class="small">${known(sk)} · ${mature(sk)}</span></div>`).join('')}</div>
  <div class="card"><b>Tone accuracy (speaking)</b><div class="grid4" style="margin-top:8px">${tone}</div>${conf ? `<p class="small muted">Most common confusions: ${conf}</p>` : ''}</div>
  <h3>Reviews due, next 14 days</h3>${forecastHTML(14)}
  <div class="card"><b>Weakest items</b><div class="list">${weakest.map(c => { const it = D.items.get(c.item) || D.ex.get(c.item) || {}; return `<div class="li"><span class="hz">${esc(it.s || it.q || it.w || c.item)}</span><span class="grow small">${SK_ZH[c.skill]} · ${c.lapses} lapses · ${c.st === 2 ? Math.round(c.s) + 'd' : 'learning'}</span>${c.leech ? '🩹' : ''}</div>`; }).join('') || '<p class="small muted">Nothing yet.</p>'}</div></div>
  <div class="card small muted">Streak ${META.streak.n} · ${cs.length} cards · ${Object.keys(META.progress.lessons).length} lessons done</div>`;
};
V.chart = () => {
  const IN = ['', 'b', 'p', 'm', 'f', 'd', 't', 'n', 'l', 'g', 'k', 'h', 'j', 'q', 'x', 'zh', 'ch', 'sh', 'r', 'z', 'c', 's', 'y', 'w'];
  const keys = Object.keys(D.syl);
  const initOf = k => k.startsWith('zh') || k.startsWith('ch') || k.startsWith('sh') ? k.slice(0, 2) : (/^[bpmfdtnlgkhjqxrzcsyw]/.test(k) ? k[0] : '');
  view.innerHTML = `<h2>🔤 拼音表 Pinyin chart</h2><p class="small muted">Tap a syllable, then a tone. ${keys.length} syllables.</p><div class="card" id="toneRow"><span class="muted small">pick a syllable</span></div>
  ${IN.map(i => { const ks = keys.filter(k => initOf(k) === i); return ks.length ? `<h3>${i || '(no initial)'}</h3><div class="pyc">${ks.map(k => `<button data-k="${k}">${esc(k.replace('v', 'ü'))}</button>`).join('')}</div>` : ''; }).join('')}`;
  $$('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k, cs = [...(D.syl[k] || '')];
    $('#toneRow').innerHTML = `<div class="grid4">${[1, 2, 3, 4].map(t => cs[t - 1] && cs[t - 1] !== '_' ? `<button class="btn" data-act="say" data-t="${cs[t - 1]}" data-p="${esc(Core.markSyl(k.replace('v', 'ü'), t))}" data-r="0.8"><span class="t${t}" style="color:var(--t${t})">${esc(Core.markSyl(k.replace('v', 'ü'), t))}</span><br><span class="hz">${cs[t - 1]}</span></button>` : `<button class="btn" disabled>${esc(Core.markSyl(k.replace('v', 'ü'), t))}</button>`).join('')}</div>`;
    const ti = cs.findIndex(c => c !== '_'); ti >= 0 && say(cs[ti], 0.8, Core.markSyl(k.replace('v', 'ü'), ti + 1));
  });
};
V.settings = () => {
  const s = S(), vs = TTS.ok ? speechSynthesis.getVoices().filter(v => /^zh|cmn/i.test(v.lang)) : [];
  view.innerHTML = `<h2>⚙️ Settings</h2>
  <div class="card"><label>New items per day <input type="text" inputmode="numeric" id="s_new" value="${s.newLimit}"></label>
  <label>Daily review goal <input type="text" inputmode="numeric" id="s_goal" value="${s.goal}"></label>
  <label>Target retention (0.80–0.97) <input type="text" inputmode="decimal" id="s_ret" value="${s.retention}"></label></div>
  <div class="card"><label>Pinyin over characters <select id="s_py"><option value="auto">auto: fades as you learn each word</option><option value="show">always show</option><option value="tap">on tap</option><option value="hide">never</option></select></label>
  <label>Definitions <select id="s_gl"><option value="auto">auto: Chinese from Stage 3</option><option value="en">English</option><option value="zh">Chinese when available</option></select></label>
  <label class="row"><input type="checkbox" id="s_tc" ${s.toneColors ? 'checked' : ''}> tone colours</label></div>
  <div class="card"><label>Voice <select id="s_voice"><option value="">best available</option>${vs.map(v => `<option ${v.name === s.voice ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></label>
  <label>Normal speed <input type="text" inputmode="decimal" id="s_rate" value="${s.rate}"></label>
  <label class="row"><input type="checkbox" id="s_nat" ${s.native ? 'checked' : ''}> native-speaker recordings when available (else the synthetic voice)</label>
  <label>Speech recognition <select id="s_sr"><option value="auto">use when available</option><option value="off">off: always grade myself</option></select></label>
  <button class="btn" data-act="say" data-t="你好，我们开始学习吧。">▶ test voice</button></div>
  <div class="card"><label>Theme <select id="s_th"><option value="auto">system</option><option value="light">light</option><option value="dark">dark</option></select></label>
  <label class="row"><input type="checkbox" id="s_ul" ${s.unlockAll ? 'checked' : ''}> unlock every unit (skip the 85% gates)</label></div>
  <button class="btn pri block" id="s_save">Save</button>
  <div class="card"><b>Progress file</b><p class="small muted">Everything lives on this device (IndexedDB${DB.idb ? '' : ': unavailable, using localStorage'}). Export regularly.</p>
  <button class="btn block" data-act="export">⬇ Export JSON</button><label class="btn block">⬆ Import JSON<input type="file" id="imp" accept="application/json,.json" hidden></label>
  <button class="btn block" data-act="reset" style="color:var(--bad)">Reset all progress</button></div>`;
  $('#s_py').value = s.pinyin; $('#s_gl').value = s.gloss; $('#s_sr').value = s.sr; $('#s_th').value = s.theme;
  $('#s_save').onclick = () => {
    const num = (id, lo, hi, d) => { const v = parseFloat($(id).value); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
    Object.assign(s, { newLimit: num('#s_new', 0, 200, 15) | 0, goal: num('#s_goal', 1, 2000, 60) | 0, retention: num('#s_ret', 0.8, 0.97, 0.9), pinyin: $('#s_py').value, gloss: $('#s_gl').value, toneColors: $('#s_tc').checked,
      voice: $('#s_voice').value, rate: num('#s_rate', 0.4, 1.6, 0.9), sr: $('#s_sr').value, native: $('#s_nat').checked, theme: $('#s_th').value, unlockAll: $('#s_ul').checked });
    save(); applyTheme(); TTS.pick(); toast('Saved');
  };
  $('#imp').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!Array.isArray(j.cards) || !j.meta || !j.meta.settings) throw new Error('not a 长大 export');
      if (!confirm(`Replace current progress with ${j.cards.length} cards from ${j.exported || 'file'}?`)) return;
      await DB.replaceAll(j.cards, j.meta); CARDS = new Map(j.cards.map(c => [c.id, c])); META = Object.assign(defaultMeta(), j.meta); toast('Imported'); go('#today');
    } catch (err) { toast('Import failed: ' + err.message); }
  };
};
V.help = () => {
  view.innerHTML = `<h2>ℹ️ Browser support</h2><div class="card small">
  <p><b>Speech out</b>: ${TTS.ok ? '✓ available' : '✗ missing'}${TTS.voice ? ` · voice: ${esc(TTS.voice.name)} (${esc(TTS.voice.lang)})` : ' · no Chinese voice found yet'} · ${TTS.ok ? speechSynthesis.getVoices().length : 0} voices installed, ${TTS.ok ? speechSynthesis.getVoices().filter(v => /^zh|cmn/i.test(v.lang)).length : 0} Chinese. <button class="btn sm" data-act="say" data-t="你好，我们开始学习吧。">▶ test</button><br>No sound? iPhone: flip the ring/silent switch to ring and turn the volume up (speech follows the ringer). iPhone: Settings → Accessibility → Spoken Content → Voices → Chinese (China mainland) → download an "Enhanced" voice. Android: install Google Speech Services and the Chinese (Mandarin) voice data.</p>
  <p><b>Speech recognition</b>: ${SRClass ? '✓ available' : '✗ not in this browser: you will compare recordings and grade yourself'}. Works best in Chrome on Android. On iPhone it uses Siri dictation (turn on Siri & Dictation, add Chinese (Mainland) as a dictation language); it can be flaky inside a home-screen app, so if it fails, open the site in Safari or switch recognition off in settings.</p>
  <p><b>Microphone & pitch</b>: ${navigator.mediaDevices ? '✓' : '✗'} needs HTTPS (or localhost). The tone contour is measured from your voice and compared with tone templates (Chao 55/35/214/51). Speak each syllable clearly; whispering or a noisy room gives no pitch.</p>
  <p><b>Native recordings</b>: ${D.audio ? `✓ ${D.audioSyl.size} tone syllables and ${D.audioWords.size} words` : '✗ not loaded'}. From <a href="https://github.com/hugolpz/audio-cmn">audio-cmn</a> (Hugo Lopez, INALCO): syllables voiced by Chen Wang, words by Yue Tan (shtooka.net), licensed CC BY-SA. Sentences without a recording use the synthetic voice.</p>
  <p><b>Speech grading</b>: what the recogniser hears is converted to pinyin (<a href="https://github.com/zh-lx/pinyin-pro">pinyin-pro</a>, MIT) and graded by sound and tone, so a same-sounding character counts as right and a wrong tone counts as a tone error.</p>
  <p><b>Handwriting</b>: ${HW_OK() ? '✓ Hanzi Writer loaded' : '✗ Hanzi Writer not loaded (offline on first run?)'}. Stroke data downloads per character and is cached for offline use.</p>
  <p><b>Storage</b>: ${DB.idb ? 'IndexedDB ✓' : 'localStorage fallback'}. iOS can clear site data for apps not opened in a few weeks unless installed to the home screen. Export your progress.</p></div>`;
};

// ---------------- global actions ----------------
const ACT = {
  say: el => say(el.dataset.t, el.dataset.r ? +el.dataset.r : undefined, el.dataset.p),
  quit: () => { if (confirm('End this session? Progress so far is saved.')) endSession(); },
  reviews: () => startReviews(), weak: () => startWeak(),
  lesson: el => { const l = D.lessons.get(el.dataset.id); if (l && lessonUnlocked(l)) startLesson(l); },
  check: el => startCheckpoint(D.unitById.get(el.dataset.id)), exam: el => startStageExam(+el.dataset.n),
  cram: el => startCram(el.dataset.id),
  cramsel: () => { const us = D.units.filter(unitUnlocked); sheet(`<b>Cram which unit?</b><div class="list">${us.map(u => `<a href="javascript:void 0" data-act="cram" data-id="${u.id}"><span class="grow hz">${esc(u.title)}</span>›</a>`).join('')}<a href="javascript:void 0" data-act="cram" data-id=""><span class="grow">Everything learned</span>›</a></div>`); },
  revealpy: el => el.classList.toggle('nopy'),
  trad: el => toast('繁體: ' + el.dataset.t),
  showtr: el => { const d = el.closest('.bub').querySelector('.small'); d.hidden = !d.hidden; },
  look: el => lookup(el.dataset.w, el.dataset.p),
  adddeck: el => { const it = D.items.get(el.dataset.id); if (it) learnNow(it); },
  rpy: el => { READ.py = !READ.py; $('#rd').classList.toggle('nopy', !READ.py); el.classList.toggle('on', READ.py); },
  rtr: el => { READ.tr = !READ.tr; $$('#rd .tr').forEach(e => e.hidden = !READ.tr); el.classList.toggle('on', READ.tr); },
  rall: async el => { const lines = $$('#rd .ln'); const id = location.hash.split('/')[1]; const t = D.texts.get(id); for (let i = 0; i < t.lines.length; i++) { lines.forEach((e, k) => e.classList.toggle('hl', k === i)); await say(t.lines[i].zh, el.dataset.r ? +el.dataset.r : undefined); } lines.forEach(e => e.classList.remove('hl')); },
  recite: el => recite(D.texts.get(el.dataset.id)),
  tquiz: el => textQuiz(D.texts.get(el.dataset.id), el.dataset.l),
  speed: () => speedRead(D.texts.get(location.hash.split('/')[1])),
  tdone: el => { const l = D.lessons.get(el.dataset.l); META.progress.lessons['read:' + el.dataset.id] = Date.now(); markLesson(l); go('#unit/' + l.unit); },
  rescen: el => V.scen(el.dataset.id),
  export: () => { const blob = new Blob([JSON.stringify({ app: 'zhangda', version: 1, exported: new Date().toISOString(), cards: [...CARDS.values()], meta: META })], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `zhangda-progress-${dayKey()}.json`; a.click(); },
  reset: async () => { if (!confirm('Delete ALL progress on this device? This cannot be undone. Export first if unsure.')) return; CARDS = new Map(); META = defaultMeta(); await DB.replaceAll([], META); go('#today'); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && el.dataset.act && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el); }
  if (e.target.classList.contains('scrim')) closeSheet();
});
function sheet(html) { closeSheet(); document.body.insertAdjacentHTML('beforeend', `<div class="scrim"></div><div class="sheet">${html}</div>`); }
function closeSheet() { $$('.sheet,.scrim').forEach(e => e.remove()); }
function lookup(w, p) {
  const it = D.dict.get(w);
  const chars = [...w].filter(Core.isHan).map(c => [c, D.chars.get(c)]);
  const py = it ? pyHTML(it.s, it.p) : esc(p || chars.map(([, v]) => v ? v.p : '?').join(' '));
  const mean = it ? esc(it.en) : chars.map(([c, v]) => `${c}: ${esc(v ? v.m : '?')}`).join(' · ');
  const inDeck = it && CARDS.has(it.id + '|' + skillsFor(it)[0]);
  sheet(`<div class="row"><span class="big md" style="margin:0">${esc(w)}</span><span class="grow tc">${py}</span><button class="btn ic" data-act="say" data-t="${esc(w)}">▶</button><button class="btn ic" data-act="say" data-t="${esc(w)}" data-r="0.6">🐢</button></div>
  <p>${mean}</p>${it && it.zh ? `<p class="muted">${esc(it.zh)}</p>` : ''}
  ${chars.map(([c, v]) => v ? `<p class="small"><b class="hz">${c}</b> ${esc(v.p)} · ${esc((v.c || []).join(' + '))} · ${esc(v.h || '')}</p>` : '').join('')}
  <div class="row">${it ? `<a class="btn grow" href="#entry/${encodeURIComponent(it.id)}">Open entry</a>` : ''}${inDeck ? '<span class="small muted">in your deck ✓</span>' : `<button class="btn pri grow" data-act="addlook" data-w="${esc(w)}" data-p="${esc(p || '')}">+ Add to deck</button>`}</div>`);
}
ACT.addlook = el => {
  const w = el.dataset.w; let it = D.dict.get(w);
  if (!it) { // build an ad-hoc item from the character table
    const vs = [...w].map(c => D.chars.get(c));
    it = { id: 'u.' + w, k: 'word', s: w, p: el.dataset.p || vs.map(v => v ? v.p : '').join(' '), en: vs.map((v, i) => v ? v.m : [...w][i]).join(' + '), custom: true, unit: (D.units[0] || {}).id };
    META.custom.push(it); addItem(it); save();
  }
  learnNow(it);
};
function learnNow(it) { // a one-item mini lesson, so new cards start their learning steps now
  closeSheet(); addItemCards(it); dayStat().new++;
  startSession([{ kind: 'intro', item: it.id }, ...skillsFor(it).map(sk => cardTask(CARDS.get(it.id + '|' + sk), 'lesson'))], 'lesson');
};

// ---------------- router & boot ----------------
function applyTheme() { const t = S().theme; if (t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = t; }
function route() {
  closeSheet(); if (TTS.ok) speechSynthesis.cancel();
  const [name, a, b] = (location.hash.slice(1) || 'today').split('/');
  $$('nav a').forEach(x => x.classList.toggle('on', x.dataset.tab === name || (name === 'unit' && x.dataset.tab === 'course') || (name === 'text' && x.dataset.tab === 'library') || (name === 'entry' && x.dataset.tab === 'dict')));
  if (name === 'session') { if (SES) return; return go('#today'); }
  if (SES && name !== 'session') SES = null;
  (V[name] || V.today)(a, b);
  renderStreak(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
(async function boot() {
  await DB.open();
  const { cards, meta } = await DB.load();
  CARDS = new Map(cards.map(c => [c.id, c]));
  META = meta ? Object.assign(defaultMeta(), meta, { settings: Object.assign(defaultMeta().settings, meta.settings) }) : defaultMeta();
  applyTheme(); TTS.pick();
  try { await loadData(); } catch (e) { view.innerHTML = `<div class="card">Could not load course data (${esc(e.message)}). Open the app through a web server (https or localhost), not as a file.</div>`; return; }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  route();
})();
</script>
</body>
